casos:
  - nome: alerta_com_tres_vagas
    remetente: "LinkedIn Vagas <jobs-noreply@linkedin.com>"
    assunto: "3 novas vagas para estagio em dados"
    autenticacao: "mx.exemplo.com; dkim=pass; dmarc=pass"
    corpo: "Suas vagas de hoje\n\n---------------------------------------------------------\n\n--CARTOES--\nVer todas as vagas https://www.linkedin.com/comm/jobs/search-results/?keywords=dados\n"
    cartoes: [cartao_a, cartao_b, cartao_c]
    esperado: {tipo: alerta_vaga, regra: 5_alerta_com_cartao, completos: 3, descartados: 0}

  - nome: recomendacao_de_vagas
    remetente: "jobs-listings@linkedin.com"
    assunto: "Vagas recomendadas para voce"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Vagas que combinam com seu perfil\n\n--CARTOES--\n"
    cartoes: [cartao_a, cartao_b]
    esperado: {tipo: alerta_vaga, regra: 5_alerta_com_cartao, completos: 2, descartados: 0}

  - nome: alerta_sem_vaga_nova
    remetente: "jobalerts-noreply@linkedin.com"
    assunto: "Nenhuma vaga nova para o seu alerta"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Hoje nao ha vagas novas.\nVer todas as vagas https://www.linkedin.com/comm/jobs/search-results/?keywords=dados\n"
    cartoes: []
    esperado: {tipo: alerta_vazio, regra: 6_alerta_sem_cartao, completos: 0, descartados: 0}

  - nome: candidatura_vista
    remetente: "jobs-noreply@linkedin.com"
    assunto: "Sua candidatura foi vista por Empresa Ficticia Alfa"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Veja tambem vagas parecidas\n\n--CARTOES--\n"
    cartoes: [cartao_a]
    esperado: {tipo: outro, regra: 4_assunto_nunca_vaga, completos: 0, descartados: 0}

  - nome: retorno_de_candidatura
    remetente: "jobs-noreply@linkedin.com"
    assunto: "Convite para entrevista na Empresa Ficticia Beta"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Gostariamos de agendar uma entrevista.\n\n--CARTOES--\n"
    cartoes: [cartao_b]
    esperado: {tipo: retorno, regra: 3_etapa_retorno, completos: 0, descartados: 0}

  - nome: convite_de_conexao
    remetente: "Pessoa Ficticia <invitations@linkedin.com>"
    assunto: "Pessoa Ficticia quer se conectar com voce"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Aceitar o convite\n\n--CARTOES--\n"
    cartoes: [cartao_a]
    esperado: {tipo: outro, regra: 2_caixa_nunca_vaga, completos: 0, descartados: 0}

  - nome: mensagem_de_recrutador_com_link_de_vaga
    remetente: "Recrutadora Ficticia <messages-noreply@linkedin.com>"
    assunto: "Recrutadora Ficticia enviou uma mensagem"
    autenticacao: "mx.exemplo.com; dmarc=pass"
    corpo: "Oi, temos uma vaga que combina com voce.\n\n--CARTOES--\nhttps://www.linkedin.com/comm/jobs/view/1000000099/\n"
    cartoes: [cartao_c]
    esperado: {tipo: mensagem_recrutador, regra: 2_caixa_nunca_vaga, completos: 0, descartados: 0}

  - nome: post_com_link_de_vaga
    remetente: "updates-noreply@linkedin.com"
    assunto: "Pessoa Ficticia publicou: estamos contratando"
    autenticacao: "mx.exemplo.com; dmarc=pass"
