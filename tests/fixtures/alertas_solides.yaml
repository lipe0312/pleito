cartao_a: &cartao_a |
  Vaga: Estagio em Suporte
  Empresa: Empresa Ficticia Delta
  Local: Curitiba - PR
  Ver vaga: https://vagas.solides.com.br/vaga/3000000001?utm=email

  ---------------------------------------------------------

cartao_b: &cartao_b |
  Vaga: Analista Junior de Dados
  Empresa: Empresa Ficticia Epsilon
  Local: Remoto
  Ver vaga: https://vagas.solides.com.br/vaga/3000000002?utm=email

