[project]
name = "pleito"
version = "0.1.0"
description = "Buscador, gerador de curriculo e aplicador assistido de vagas, local-first"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "pypdf>=4.2",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
viabilidade = "viabilidade.cli:main"

[tool.setuptools.packages.find]
include = ["viabilidade*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "rede: exige acesso a internet e fonte real",
    "navegador: exige Playwright instalado",
    "latex: exige pdflatex instalado",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"viabilidade/baseline/validar.py" = ["S603"]
