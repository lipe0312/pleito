backoff_429:
  base_s: 2
  max_s: 30

ats:
  fontes: [workable, smartrecruiters, personio]
  identificador_padrao: "^[A-Za-z0-9_-]{1,64}$"
  candidatos_max: 4
  saida_descoberta: dados/descobertas/ats.json
  relatorio:
    vagas_minimas: 1
    completude_minima: 0.5

descobertas_pendentes:
  comeet:
    endpoint: https://www.comeet.co/careers-api/2.0/company/{id}/positions
    estado: exige token por empresa

