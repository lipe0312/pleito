descobertas_pendentes:
  workable:
    endpoint: https://apply.workable.com/api/v1/widget/accounts/{conta}?details=true
    estado: endpoint valido, nenhuma conta brasileira conhecida ainda
  smartrecruiters:
    endpoint: https://api.smartrecruiters.com/v1/companies/{empresa}/postings
    estado: endpoint valido, identificador exato das empresas a descobrir
  personio:
    endpoint: https://{empresa}.jobs.personio.de/xml
    estado: respondeu 429 na sondagem, precisa de backoff
  comeet:
    endpoint: https://www.comeet.co/careers-api/2.0/company/{id}/positions
    estado: exige token por empresa

empresas_alvo: []
