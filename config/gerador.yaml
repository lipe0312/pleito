templates:
  pasta: templates
  arquivos:
    pt: cv_pt.tex.j2
    en: cv_en.tex.j2

jinja:
  bloco: ["<%", "%>"]
  variavel: ["<<", ">>"]
  comentario: ["<#", "#>"]

travado:
  arquivo: cabecalho.yaml
  nomes: [cabecalho, formacao]
  texto_max_chars: 200
  padrao_email: '^[A-Za-z0-9._+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$'
  padrao_url: '^(https://|mailto:)[A-Za-z0-9@._:/+\-]+$'
  prefixo_url_oculto: 'https://'
  campos_url: [link]

slots:
  sobre:
    tipo: texto
    tipo_bloco: sobre
    max_chars: 700
  disciplinas:
    tipo: lista_texto
    tipo_ancora: disciplina
    max_itens: 12
    max_chars: 60
  experiencias:
    tipo: entradas
    tipo_bloco: experiencia
    max_entradas: 6
    max_bullets: 6
    max_chars: 300
  projetos:
    tipo: entradas
    tipo_bloco: projeto
    max_entradas: 4
    max_bullets: 4
    max_chars: 300

ia:
  tarefa: escrita_slots
  tier: forte
  tipos_na_ordem_dos_blocos: [experiencia]
  tipos_com_enfase: [projeto]
  entradas_min:
    projeto: 3
  bullets_min: 1
  techs_max: 8
  tech_max_chars: 60
  enfase_max: 4

sem_ia:
  entradas_por_tipo:
    projeto: 3
  bullets_por_tipo:
    experiencia: 3
    projeto: 2
  peso_familia: 2
  peso_tech: 1

compilacao:
  motor: pdflatex
  nome_arquivo: cv
  argumentos: [-no-shell-escape, -interaction=nonstopmode, -halt-on-error]
  ambiente:
    openin_any: p
    openout_any: p
    shell_escape: f
  variaveis_herdadas: [PATH, HOME]
  linhas_do_erro: 15
  timeout_s: 90
  paginas_max: 1
