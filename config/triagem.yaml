  tier: forte
  prompt: prompts/pontuar_vaga.md
  titulo_max_chars: 200
  techs_max: 20
  tech_max_chars: 60
  requisitos_max: 10
  requisito_max_chars: 120
  justificativa_max_chars: 400
  alertas_max: 10
  idioma_dos_focos: pt
  alertas: [possivel_golpe, exige_visto, senioridade_acima, texto_suspeito]
  alerta_texto_suspeito: texto_suspeito
  padroes_injecao:
    - '\bignor(e|ar|em)\b'
    - '\b(disregard|forget|override)\b'
    - '\b(instru[cç][oõ]es|instructions?|system prompt)\b'
    - '\b(execute|executar|rode|run|curl|wget|sudo)\b'
    - '\b(senha|password|token|segredo|secret|\.env|api[ _-]?key)\b'
    - '\b(voc[eê] deve|you must|you are now)\b'
