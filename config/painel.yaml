host_bind: 127.0.0.1
porta: 8765
esquema_origem: http
token_bytes: 32
fetch_site_aceitos:
  - same-origin
  - none
hosts_permitidos:
  - 127.0.0.1
  - localhost
csrf_cabecalho: X-CSRF-Token
metodos_seguros:
  - GET
  - HEAD
  - OPTIONS
csp:
  default-src: "'none'"
  script-src: "'self'"
  style-src: "'self'"
  img-src: "'self'"
  connect-src: "'self'"
  form-action: "'self'"
  base-uri: "'none'"
  frame-ancestors: "'none'"
  frame-src: "'self'"
pdf:
  prefixo_rota: /pdf/
  csp:
    frame-ancestors: "'self'"
  cabecalhos:
    X-Frame-Options: SAMEORIGIN
cabecalhos:
  X-Content-Type-Options: nosniff
  X-Frame-Options: DENY
  Referrer-Policy: no-referrer
  Cross-Origin-Opener-Policy: same-origin
  Cross-Origin-Resource-Policy: same-origin
  Cache-Control: no-store

fuso: America/Sao_Paulo
formato_hora: "%H:%M"
formato_data: "%d/%m %H:%M"
formato_dia: "%d/%m/%Y"
limite_eventos_dia: 100
limite_pendencias: 50
limite_candidaturas: 300
rota_inicial: /hoje
htmx:
  includeIndicatorStyles: false
  allowEval: false
  responseHandling:
    - {code: "204", swap: false}
    - {code: "[23]..", swap: true}
    - {code: "^(404|409|422)$", swap: true, error: false}
    - {code: "[45]..", swap: false, error: true}
status_da_decisao:
  motivo_vazio: 422
  motivo_longo: 422
  invalida: 422
  ja_decidida: 409
  projeto_nao_aprovado: 409
  inexistente: 404
corpo_max_bytes: 4096
motivo_max_chars: 500
aprovador: Filipe

curriculos:
  pasta_familias: familias
  padrao_id: '^[A-Za-z0-9_-]+$'
  json_max_bytes: 1000000
  pdf_max_bytes: 5000000
  niveis_que_negam_selo: [bloqueia]
  casas_custo: 4
  rotulo_vaga: "Vaga {id}"
  rota: /curriculos
  limite: 300
  niveis_de_selo: {bloqueia: erro, indicio: atencao, ok: ok}
  sinais_do_diff: {saiu: "−", entrou: "+"}
  classe_da_situacao:
    funcional: ok
    com_bloqueio: erro
    sem_pdf: atencao
    sem_validacao: atencao
    sem_versao: neutro

navegacao:
  - {chave: hoje, rota: /hoje, rotulo: Hoje}
  - {chave: candidaturas, rota: /candidaturas, rotulo: Candidaturas}
  - {chave: curriculos, rota: /curriculos, rotulo: Currículos}
  - {chave: projetos, rota: /projetos, rotulo: Projetos}

etapas_candidatura:
  - {estado: oferta, rotulo: Oferta}
  - {estado: entrevista, rotulo: Entrevista}
  - {estado: teste, rotulo: Teste}
  - {estado: pendente, rotulo: Pendente}
  - {estado: aplicada_confirmada, rotulo: Aplicação confirmada}
  - {estado: aplicada_aguardando_confirmacao, rotulo: "Aplicada, aguardando confirmação"}
  - {estado: aplicada_nao_confirmada, rotulo: Aplicada sem confirmação}
  - {estado: encerrada, rotulo: Encerrada}
  - {estado: rejeitada_pela_empresa, rotulo: Recusada pela empresa}

tipos_evento:
  aplicada: {rotulo: Aplicação confirmada, classe: ok}
  teste: {rotulo: Teste recebido, classe: alerta}
  entrevista: {rotulo: Convite de entrevista, classe: alerta}
  oferta: {rotulo: Oferta, classe: alerta}
  encerrada: {rotulo: Processo encerrado, classe: neutro}
  classificar: {rotulo: Para classificar, classe: atencao}
  suspeito: {rotulo: Suspeito, classe: erro}

