paginas_max: 1

niveis:
  paginas: bloqueia
  tecnologia: bloqueia
  travessao: bloqueia
  latex: bloqueia
  caractere_invisivel: bloqueia
  alfabeto: bloqueia
  preambulo: bloqueia
  cabecalho: bloqueia
  experiencias: bloqueia
  experiencia_vazia: bloqueia
  numero: bloqueia
  empresa_da_vaga: bloqueia
  copia_da_vaga: indicio
  estrutura: bloqueia
  projetos: bloqueia
  escape: bloqueia
  idioma: bloqueia
  pontuacao: indicio
  senioridade: bloqueia
  compilacao: bloqueia
  caixa_estourada: bloqueia
  titulo_e_data: bloqueia
  sobreposicao: bloqueia
  limites_de_layout: bloqueia

latex:
  comentario: "%"
  ambiente_do_corpo: document
  sequencias_proibidas: ["^^"]
  links:
    esquema_seguro: https
    dominios: [github.com, linkedin.com, example.invalid]
    esquemas_sem_dominio: ["mailto:"]
  medidas:
    comandos: {vspace: 1, setlength: 2, titlespacing: 4}
    minimo_mm: 0
    maximo_mm: 30
    unidades_mm: {pt: 0.3515, bp: 0.3528, mm: 1.0, cm: 10.0, pc: 4.2175, in: 25.4}
  corpo:
    comandos:
      - tech
      - href
      - textbf
      - large
      - section
      - hfill
      - vspace
      - item
      - begin
      - end
      - textbackslash
      - textasciicircum
      - textasciitilde
      - textquotedbl
      - textless
      - textgreater
      - textbar
      - textasciigrave
    ambientes: [document, center, itemize]
    simbolos: ["\\", "{", "}", "%", "&", "_", "$", "#"]
  preambulo:
    comandos:
      - tech
      - documentclass
      - usepackage
      - definecolor
      - newcommand
      - setlist
      - titleformat
      - section
      - titlespacing
      - pagestyle
      - setlength
      - parindent
      - textcolor
      - textbf
      - large
      - bfseries
      - titlerule
    classes:
      article: ['a4paper', '10pt']
    pacotes:
      fontenc: ['T1']
      inputenc: ['utf8']
      lmodern: []
      babel: ['brazil', 'english']
      geometry: ['a4paper', 'margin=[0-9]+(\.[0-9]+)?cm']
      xcolor: []
      enumitem: []
      titlesec: []
      hyperref: ['hidelinks']
    definiveis: [tech]
    simbolos: ["\\", "{", "}"]

caracteres:
  proibidos: ["—", "―", "⸺", "⸻", "﹘"]
  sequencias_proibidas: ["---"]
  categorias_unicode_proibidas: [Cc, Cf, Cn, Co, Cs, Zl, Zp]
  controles_permitidos: ["\n", "\r", "\t"]
  alfabeto:
    scripts: [LATIN]
    scripts_com_base_ascii: [LATIN]
    extras: ["\u00aa", "\u00ba"]

tecnologias_conhecidas:
  - Kubernetes
  - Kafka
  - Terraform
  - Ansible
  - Jenkins
  - AWS
  - Azure
  - Hadoop
  - Spark
  - Airflow
  - Snowflake
  - TensorFlow
  - PyTorch
  - Django
  - Angular
  - Redis
  - MongoDB
  - Elasticsearch
  - GraphQL
  - Kotlin
  - Scala

tecnologias:
  exigir_caixa:
    - Go
    - Swift
    - Dart
    - Ruby
    - Express
    - Spring
    - Apache
    - Oracle
    - Phoenix
    - Gin
    - Babel
    - Unity
    - Unreal
    - Cypress
    - Puppet
    - Vagrant
    - Pulsar
    - Elixir
    - Groovy
    - Hibernate
    - Bootstrap
    - Electron
    - Prometheus
  forca_por_origem:
    inventario: forte
    linguagem: forte
    topic: forte
    readme: fraca
    pagina: fraca
  forca_padrao: fraca

dados:
  arquivos:
    tecnologias: tecnologias.yaml
    vocabulario: vocabulario.yaml
  vocabulario:
    ngrama_max: 3
    sigla_min_chars: 2
    termo_min_chars: 4

calibracao:
  subpasta: validador/calibracao
  metas:
    falso_positivo_max: 0.05
    falso_negativo_max: 0.1
  por_regra: {}
  injecoes:
    tecnologia:
      fonte: proibidos_tecnologia
      modelo: {pt: "Experiência com {termo}.", en: "Experience with {termo}."}
    numero:
      fonte: proibidos_numero
      modelo: {pt: "Entreguei {termo} de resultado.", en: "Delivered {termo} of results."}
    senioridade:
      fonte: proibidos_palavra
      tipos: [senior_disfarcado]
      ignorar: [lideran]
      modelo: {pt: "{termo} o time.", en: "{termo} the team."}
    empresa_da_vaga:
      fonte: empresa
      modelo: {pt: "Atuo pensando na {termo}.", en: "I work thinking of {termo}."}
    copia_da_vaga:
      fonte: anuncio
      modelo: {pt: "{termo}", en: "{termo}"}

conteudo:
  trecho_max_chars: 120
  secoes:
    pt: {sobre: Sobre, formacao: Formação, experiencia: Experiência, projetos: Projetos}
    en: {sobre: About, formacao: Education, experiencia: Experience, projetos: Projects}
  preambulo:
    parametros_livres:
      - '\\linespread\{[0-9]+(?:\.[0-9]+)?\}'
      - ',?(?:margin|top|bottom)=[0-9]+(?:\.[0-9]+)?cm'
  projetos:
    minimo: 3
    maximo: 4
    rotulo_final: {pt: Mais projetos, en: More projects}
  copia_da_vaga:
    palavras: 8
  empresa_da_vaga:
    tamanho_minimo: 3
    sufixos: [ltda, s.a., sa, eireli, me, inc, llc, ltd, gmbh, corp, co]
  negrito:
    comandos: [textbf, bfseries, bf, mathbf]
  escapes:
    simbolos: ["&", "_", "#", "$"]
  idioma:
    nomes: {pt: portugues, en: ingles}
    marcadores:
      pt: [com, em, uma, para, sobre, de, do, da, e, os, as, "no", na, que]
      en: [with, the, for, and, of, in, "on", over, an, to, that, is]

layout:
  fonte_padrao_pt: 10
  chaves_de_margem: [margin, top, bottom, left, right, hmargin, vmargin, inner, outer]
  log:
    tamanho_max_bytes: 2000000
    erros_max: 5
    linhas_do_erro: 4
    caixas_max: 5
    linhas_da_caixa: 2
    defasagem_max_s: 5
    overfull_max_pt: 1.0
    underfull_badness_max: 5000
    overfull_vbox_max_pt: 1.0
    underfull_vbox_badness_max: 5000
  pdf:
    tolerancia_de_linha_pt: 1.5
    ascendente_em: 0.7
    descendente_em: 0.2
    sobreposicao_x_min_pt: 1.0
    sobreposicao_y_min_pt: 1.0
    sobreposicoes_max: 5
    largura_sem_metrica_em: 0.5
    caixas_max: 2000
  por_idioma:
    pt: {fonte_min_pt: 10, linespread_min: 0.88, margem_min_mm: 10}
    en: {fonte_min_pt: 10, linespread_min: 0.90, margem_min_mm: 10}
